    <title>Home</title>

    <!-- The type is served from here, not from Google: the faces the pages
         used to link from fonts.googleapis.com are mirrored into assets/fonts
         by scripts/fonts-vendor.mjs, subsets and all — Long Cang included,
         still cut down to the three characters of the name. Same origin means
         no second and third handshake before a single glyph arrives, and
         document.fonts.ready — which the entrance waits on — settles in the
         time a local fetch takes rather than a stranger's.

         A <link> rather than an @import inside <style>: an @import isn't
         discovered until the stylesheet around it has been fetched and parsed,
         which serialises page CSS → font CSS → font files. -->
    <link rel="stylesheet" href="/assets/fonts/fonts.css">
    <!-- Retired with the Manchu column in the body: nothing renders in this
         face now, so a live preload would pull 30kB down for no one. Left here,
         commented, beside its @font-face and its styles in the stylesheet.

         Preloaded, unlike the Google faces above: a font is otherwise only
         fetched once layout reaches text that uses it, which can land after
         document.fonts.ready has already settled. The entrance waits on that
         promise, so losing the race means the name paints in the fallback and
         then re-lays out. Starting the fetch here closes it.

         <link rel="preload" href="assets/fonts/degede-uran.woff2" as="font" type="font/woff2" crossorigin>
    -->
    <!-- The seal stamps are CSS mask-images, and a mask's fetch doesn't start
         until the stylesheet has been parsed and applied. These start the
         three downloads at parse time instead, alongside style.css. -->
    <link rel="preload" href="assets/icons/github.svg" as="image" type="image/svg+xml">
    <link rel="preload" href="assets/icons/linkedin.svg" as="image" type="image/svg+xml">
    <link rel="preload" href="assets/icons/twitter.svg" as="image" type="image/svg+xml">
    <!-- The -carve variants only appear on hover; fetched here so the first
         hover doesn't spend its moment waiting on the network. -->
    <link rel="preload" href="assets/icons/github-carve.svg" as="image" type="image/svg+xml">
    <link rel="preload" href="assets/icons/linkedin-carve.svg" as="image" type="image/svg+xml">
    <link rel="preload" href="assets/icons/twitter-carve.svg" as="image" type="image/svg+xml">
    <link rel="stylesheet" href="style.css">

    <!-- Inline and synchronous on purpose: this has to land before the first
         paint, or the page flashes at full opacity before the entrance runs.

         And conditional on where the reader came from: the hold-then-rise
         exists to cross with the departure fade of the kvnyng.com page before
         it. Arriving from anywhere else — a search result, a shared link, a
         bare address — there was no fade on the other side, so there is no
         hold on this one: start() below sees the missing class and reveals at
         once, and the entrance plays from first paint instead of after the
         fonts. An empty or opaque referrer throws in the URL constructor and
         lands in the no-hold case, which is the right reading of not
         knowing. -->
    <script>
        try {
            if (new URL(document.referrer).origin === location.origin)
                document.documentElement.classList.add('js-preload');
        } catch (e) { }
    </script>

    <script defer src="main.js"></script>

    <script>
        const slug = '/'; // dynamically generated in real use
        fetch(`https://view-counter-worker.kvnyng.workers.dev?slug=${slug}`, { method: "POST" });
    </script>

<body>
    <!-- data-reveal marks an element as part of the entrance; --reveal-order is
         its place in the queue. The two columns interleave rather than running
         one after the other, so the page fills in diagonally. -->
    <div class="container">
        <div class="left">
            <!-- The portrait and the script column run as one unit: the column
                 down the portrait's right edge, the name below it, so the type
                 turns a corner around the photograph. -->
            <div class="identity">
                <div class="profile-pic" data-reveal style="--reveal-order: 0">
                    <img src="assets/images/pfp.jpeg" alt="Kevin Yang" width="160" height="160">
                </div>
                <!-- A button rather than text: pressing it replays its stroke,
                     and that should be reachable from the keyboard and announced
                     as something you can press. .script-name is what any such
                     column shares — the reset, the hover, the stroke; the second
                     class carries what is particular to the hand.

                     The name is here twice. The span is the name as text — kept
                     for find-on-page, for anything that copies or reads the
                     document, and for a browser that never applies the
                     stylesheet; hidden from the eye by clipping rather than by
                     display, because a name that is display: none is a name that
                     is not there at all. The SVG under it is the same three
                     characters as Long Cang's own outlines, which is a picture of
                     a word rather than the word, and so is aria-hidden. Drawing
                     them rather than setting them is what lets the strokes arrive
                     one at a time, in the order a hand lays them down.

                     Everything between the two markers is generated — the
                     outlines, the pen medians that reveal them and the timing
                     each stroke is given. Re-run `node __strokes/build.mjs` after
                     a re-fit rather than editing it by hand.

                     aria-label rather than title: the description is worth having
                     for anyone who can't see the strokes, but as a title it also
                     came back as a browser tooltip — a grey box parked over the
                     portrait, which is the one thing on the page the name is
                     meant to sit quietly beside. The colour change on hover is
                     hint enough that it's live.

                     lang on the span, not the button — it belongs to the three
                     characters, so a Chinese voice reads them and doesn't try
                     the English aria-label in the same breath. -->
                <button class="script-name name-hanzi" type="button" data-reveal style="--reveal-order: 1"
                    aria-label="Yang Hongkai, written in Chinese — press to write it again">
                    <span class="visually-hidden" lang="zh-Hans">杨泓锴</span>

                     ink only — the paper was left untraced, so the page's
                     ground shows through as the ink-free carving.

    <script>
        const VIEWS = {
            past: 'content/past.html',
            present: 'content/present.html',
            future: 'content/future.html',
        };
        const DEFAULT_VIEW = 'present';

        // Where the content entries join the entrance queue, continuing the
        // count the left column starts.
        const ENTRY_BASE = 3;

        // Nothing waits forever. If the fonts or the portrait stall, reveal
        // without them — a late font swap is a worse look than a blank page,
        // but only up to a point.
        const READY_TIMEOUT = 1500;

        const root = document.documentElement;
        const selector = document.querySelector('.selector');
        const content = document.querySelector('.content');
        const tabs = Array.from(selector.querySelectorAll('[data-view]'));

        // Durations live in the stylesheet; read them back rather than
        // restating them here, so the two can't drift apart.
        const ms = prop => {
            const value = getComputedStyle(root).getPropertyValue(prop).trim();
            return value.endsWith('ms') ? parseFloat(value) : parseFloat(value) * 1000;
        };
        const SWAP_OUT_MS = ms('--swap-out-duration');
        // Longest possible entrance: the last element's delay plus its run.
        const ENTRANCE_MS = ms('--reveal-duration') + 10 * ms('--reveal-stagger');

        const cache = new Map();
        let currentView = null;
        // Bumped per request. A response whose token is stale belongs to a view
        // the user has already clicked away from, so it gets dropped.
        let requestToken = 0;

        function loadView(name) {
            if (!cache.has(name)) {
                cache.set(name, fetch(VIEWS[name])
                    .then(response => {
                        if (!response.ok) throw new Error(`${response.status} ${response.statusText}`);
                        return response.text();
                    })
                    .catch(error => {
                        console.error(`Could not load the ${name} view:`, error);
                        cache.delete(name); // so a retry is an actual retry
                        return '<p>Could not load this one — try again?</p>';
                    }));
            }
            return cache.get(name);
        }

        // A link out of the site opens in a tab of its own, so the view the
        // reader was on is still sitting here when they come back.
        //
        // Done from script rather than written into the fragments so it holds
        // for every link the views ever carry, and run per paint rather than
        // once at load: the fragments arrive by fetch, well after
        // DOMContentLoaded, and again on every swap — there is no single moment
        // when all of the links exist.
        //
        // The hostname is compared rather than searched for inside the href, so
        // a host that merely contains this one's name isn't taken for it. rel
        // beside target because the opened tab otherwise keeps a live
        // window.opener handle back to this page.
        function sendExternalLinksToNewTab(root) {
            root.querySelectorAll('a[href^="http"]').forEach(link => {
                if (link.hostname === location.hostname) return;
                link.target = '_blank';
                link.rel = 'noopener noreferrer';
            });
        }

        function paint(html) {
            content.innerHTML = html;
            sendExternalLinksToNewTab(content);
            // Number the entries so the stagger in CSS doesn't need to know how
            // many there are.
            content.querySelectorAll('.entry').forEach((entry, i) => {
                entry.style.setProperty('--entry-index', String(i));
            });
        }

        function markSelected(name) {
            tabs.forEach(tab => tab.classList.toggle('selected', tab.dataset.view === name));
        }

        function fadeOut() {
            content.classList.add('is-swapping');
            return new Promise(resolve => setTimeout(resolve, SWAP_OUT_MS));
        }

        async function show(name) {
            if (!VIEWS[name] || name === currentView) return;

            const token = ++requestToken;
            currentView = name;
            markSelected(name);

            // Fetch and fade out concurrently, so the network round trip is
            // spent inside the animation rather than after it.
            const [html] = await Promise.all([loadView(name), fadeOut()]);
            if (token !== requestToken) return;

            paint(html);
            content.classList.remove('is-swapping');
        }

        selector.addEventListener('click', event => {
            const tab = event.target.closest('[data-view]');
            if (tab) show(tab.dataset.view);
        });

        // Press a name and it writes itself on again. The class is stripped
        // and re-added rather than just added, so a second press restarts the
        // stroke instead of being swallowed by the one already running —
        // reading offsetWidth in between is what forces the removal to land
        // before the addition, rather than the two collapsing into no change.
        //
        // Per column rather than delegated from the row: each one owns its own
        // is-writing, so pressing one mid-stroke doesn't restart the other, and
        // any two can be writing at once. There is one column at the moment —
        // the Manchu one is commented out in the markup above — but this loop
        // is what lets it come back without touching the script.
        document.querySelectorAll('.script-name').forEach(column => {
            column.addEventListener('click', () => {
                column.classList.remove('is-writing');
                void column.offsetWidth;
                column.classList.add('is-writing');
            });

            // Guarded by name because plenty of other animations end on these
            // elements: the entrance runs on the button itself, and the Chinese
            // column ends 27 more animations on its way through the name, one per
            // stroke. Clearing the class on any of those would drop every pen
            // back to its resting offset — fully drawn — and a half-written name
            // would snap to complete. Each column therefore names
            // its last animation something of its own — write-on for the wipe,
            // hz-write-on for the final stroke of 锴 — and only that one ends the
            // write.
            column.addEventListener('animationend', event => {
                if (event.animationName === 'write-on' || event.animationName === 'hz-write-on') {
                    column.classList.remove('is-writing');
                }
            });
        });

        // Resolves once the webfonts have settled. This is the whole reason the
        // entrance waits: `display=swap` paints Georgia first and reflows to
        // Garamond a beat later, and hiding that reflow is most of what makes
        // the load feel clean.
        const fontsSettled = () => document.fonts ? document.fonts.ready : Promise.resolve();

        // Same idea for the portrait — a circle that fills in after the fact is
        // the other visible pop on first load.
        function imageSettled() {
            const img = document.querySelector('.profile-pic img');
            if (!img || img.complete) return Promise.resolve();
            return new Promise(resolve => {
                img.addEventListener('load', resolve, { once: true });
                img.addEventListener('error', resolve, { once: true });
            });
        }

        const withDeadline = (promise, limit) =>
            Promise.race([promise, new Promise(resolve => setTimeout(resolve, limit))]);

        async function start() {
            content.style.setProperty('--entry-base', String(ENTRY_BASE));
            currentView = DEFAULT_VIEW;
            markSelected(DEFAULT_VIEW);

            // The first view is part of the entrance rather than a swap, so it
            // needs to be in the DOM before the reveal — otherwise the right
            // column animates in empty. If it loses the race against the
            // deadline it still animates, just a beat late.
            const firstView = loadView(DEFAULT_VIEW).then(paint);

            if (root.classList.contains('js-preload')) {
                try {
                    await withDeadline(
                        Promise.all([firstView, fontsSettled(), imageSettled()]),
                        READY_TIMEOUT
                    );
                } finally {
                    // In a finally, because .js-preload holds the page at opacity 0
                    // — anything thrown on the way here would otherwise leave a
                    // permanently blank page. Revealing early is recoverable; never
                    // revealing is not.
                    root.classList.remove('js-preload');
                    root.classList.add('is-revealed');
                }
            } else {
                // The head set no hold — the reader came from off the site,
                // and this entrance has no departure to answer. Reveal now:
                // everything rises from first paint, and the view joins in
                // the moment its fetch lands.
                root.classList.add('is-revealed');
            }

            // Swaps from here on shouldn't inherit the entrance's head start.
            setTimeout(() => content.style.setProperty('--entry-base', '0'), ENTRANCE_MS);
        }

        start();
    </script>
    <!-- ── Departure ────────────────────────────────────────────────────────
         The counterpart to the entrance. Every page of this site holds at
         nothing and rises into place; without this, following a link cuts the
         one you are on off where it stands, and the next begins its rise over
         a screen that has already gone. So a click on an internal link fades
         this document out first and only hands the URL over at the end of the
         fade: the two cross on the grey they share rather than one replacing
         the other mid-sentence.

         Only the leaving is new. The arriving half is the entrance that was
         already here.

         Copied, all but verbatim, into /resume/index.html. Each page here
         carries what it needs — the resume page copies its tokens rather
         than linking them, for the same reason — and twenty lines is less
         than a shared file and the request that fetches it would cost. -->
    <script>
        (() => {
            const root = document.documentElement;

            // The length lives in the stylesheet, beside the rule it drives, so
            // the wait and the fade can't drift apart — and so the
            // reduced-motion override shortens the two of them together.
            const declared = getComputedStyle(root).getPropertyValue('--leave-duration').trim();
            const LEAVE_MS = declared.endsWith('ms') ? parseFloat(declared) : parseFloat(declared) * 1000;

            // Where following the link under this element would take the
            // reader, if following it means replacing this document — and null
            // if it doesn't. A new tab, a download, a link off the site, a
            // fragment on this same page: all real navigations, none of them a
            // departure, and swallowing one would break the link rather than
            // dress it. An SVG <a> falls out here too, on the instanceof: its
            // href isn't a string, and nothing on the site uses one.
            function destinationOf(target) {
                const link = target.closest && target.closest('a[href]');
                if (!(link instanceof HTMLAnchorElement)) return null;
                if (link.target && link.target !== '_self') return null;
                if (link.hasAttribute('download')) return null;
                const url = new URL(link.href);
                if (url.origin !== location.origin) return null;
                if (url.pathname === location.pathname && url.search === location.search) return null;
                return url.href;
            }

            // A middle click, a modified click, a click something else has
            // already claimed: the browser has its own plans for those.
            const isPlainClick = event =>
                !event.defaultPrevented && event.button === 0
                && !event.metaKey && !event.ctrlKey && !event.shiftKey && !event.altKey;

            // Warm the destination on the way to the click. The fade is a fixed
            // length; the request behind it is not, and an unwarmed one leaves
            // the reader looking at an empty room for however long the network
            // takes. Asked for on hover — and on the first touch, which arrives
            // as one — the document is usually already in hand by the time the
            // fade is over. The same move the view swap makes by fetching and
            // fading at once. A browser that ignores the hint just asks at
            // navigation time, which is where it began.
            const warmed = new Set();
            addEventListener('pointerover', event => {
                const href = destinationOf(event.target);
                if (!href || warmed.has(href)) return;
                warmed.add(href);
                const hint = document.createElement('link');
                hint.rel = 'prefetch';
                hint.href = href;
                document.head.appendChild(hint);
            });

            addEventListener('click', event => {
                if (!isPlainClick(event)) return;
                const href = destinationOf(event.target);
                if (!href) return;
                event.preventDefault();
                root.classList.add('is-leaving');
                setTimeout(() => { location.href = href; }, LEAVE_MS);
            });

            // Step back into a page the browser kept whole and it is handed
            // back exactly as it was left — faded to nothing, halfway out the
            // door. Nothing else clears the class, because on an ordinary load
            // nothing carries it in.
            addEventListener('pageshow', event => {
                if (event.persisted) root.classList.remove('is-leaving');
            });
        })();
    </script>
</body>
