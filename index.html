<!DOCTYPE html>
<html lang="en">

<head>
    <!-- Google tag (gtag.js) -->
    <script async src="https://www.googletagmanager.com/gtag/js?id=G-YFRHXEL78W"></script>
    <script>
        window.dataLayer = window.dataLayer || [];
        function gtag() { dataLayer.push(arguments); }
        gtag('js', new Date());

        gtag('config', 'G-YFRHXEL78W');
    </script>

    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Home</title>

    <!-- A <link> rather than an @import inside <style>: an @import isn't
         discovered until the stylesheet around it has been fetched and parsed,
         which serialises page CSS → font CSS → font files. The preconnects
         warm both font hosts while style.css is still in flight. -->
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link
        href="https://fonts.googleapis.com/css2?family=Azeret+Mono:ital,wght@0,100..900;1,100..900&family=EB+Garamond:ital,wght@0,400..800;1,400..800&family=Philosopher:ital,wght@0,400;0,700;1,400;1,700&display=swap"
        rel="stylesheet">
    <!-- The brush hand for the Chinese column — see the note on --font-hanzi
         for why this one.

         A request of its own, because `text` applies to every family in the URL
         it appears in and the three faces above need their whole character set.
         It earns the extra round trip several times over: Long Cang is a CJK
         face, and the three characters of the name fall in three different
         unicode-range subsets, so the ordinary link would pull ~120kB down over
         three connections to draw them. Named explicitly, Google returns one
         file holding those three glyphs and nothing else — 2.2kB. -->
    <link href="https://fonts.googleapis.com/css2?family=Long+Cang&text=%E6%9D%A8%E6%B3%93%E9%94%B4&display=swap"
        rel="stylesheet">
    <link rel="stylesheet" href="style.css">

    <!-- Inline and synchronous on purpose: this has to land before the first
         paint, or the page flashes at full opacity before the entrance runs. -->
    <script>document.documentElement.classList.add('js-preload');</script>

    <script defer src="main.js"></script>

    <script>
        const slug = '/'; // dynamically generated in real use
        fetch(`https://view-counter-worker.kvnyng.workers.dev?slug=${slug}`, { method: "POST" });
    </script>
</head>

<body>
    <!-- data-reveal marks an element as part of the entrance; --reveal-order is
         its place in the queue. The two columns interleave rather than running
         one after the other, so the page fills in diagonally. -->
    <div class="container">
        <div class="left">
            <!-- The portrait and the script column run as one unit: the column
                 down the portrait's right edge, the name below it, so the type
                 turns a corner around the photograph. -->
            <div class="identity">
                <div class="profile-pic" data-reveal style="--reveal-order: 0">
                    <img src="assets/images/pfp.jpeg" alt="Kevin Yang" width="160" height="160">
                </div>
                <!-- A button rather than text: pressing it replays its stroke,
                     and that should be reachable from the keyboard and announced
                     as something you can press. .script-name is what any such
                     column shares — the reset, the hover, the stroke; the second
                     class carries what is particular to the hand. The inner span
                     is what the animation runs on, for the reason given in the
                     stylesheet.

                     aria-label rather than title: the description is worth having
                     for anyone who can't see the strokes, but as a title it also
                     came back as a browser tooltip — a grey box parked over the
                     portrait, which is the one thing on the page the name is
                     meant to sit quietly beside. The colour change on hover is
                     hint enough that it's live.

                     lang on the span, not the button — it belongs to the three
                     characters, so it steers font selection if the webfont never
                     lands and it doesn't hand the English aria-label to a
                     Chinese voice. -->
                <button class="script-name name-hanzi" type="button" data-reveal style="--reveal-order: 1"
                    aria-label="Yang Hongkai, written in Chinese — press to write it again">
                    <span lang="zh-Hans">杨泓锴</span>
                </button>
            </div>
            <h1 class="title" data-reveal style="--reveal-order: 2">KEVIN YANG</h1>
            <h2 class="subtitle" data-reveal style="--reveal-order: 3">/kɛvɪn/ • /yaŋ/</h2>
            <h2 class="subtitle motto" data-reveal style="--reveal-order: 4">engineering the best vibes</h2>
            <p class="tagline" data-reveal style="--reveal-order: 5">@harvard @csail @neo @contrary</p>
            <div class="socials" data-reveal style="--reveal-order: 6">
                <h1>the links</h1>
                <div class="links">
                    <p>⇱ <a href="https://github.com/kvnyng" target="_blank">Github</a></p>
                    <p>⇱ <a href="https://linkedin.com/in/kvnyng" target="_blank">LinkedIn</a></p>
                    <p>⇱ <a href="https://twitter.com/kineticyang" target="_blank">Twitter</a></p>
                </div>
            </div>
        </div>

        <div class="right">
            <div class="selector" data-reveal style="--reveal-order: 2">
                <p>
                <p class="underlined">the</p> <span class="past" data-view="past">past</span>/<span class="present"
                    data-view="present">present</span>/<span class="future" data-view="future">future</span></p>
            </div>
            <div class="content"></div>
        </div>
    </div>

    <script>
        const VIEWS = {
            past: 'content/past.html',
            present: 'content/present.html',
            future: 'content/future.html',
        };
        const DEFAULT_VIEW = 'present';

        // Where the content entries join the entrance queue, continuing the
        // count the left column starts.
        const ENTRY_BASE = 3;

        // Nothing waits forever. If the fonts or the portrait stall, reveal
        // without them — a late font swap is a worse look than a blank page,
        // but only up to a point.
        const READY_TIMEOUT = 1500;

        const root = document.documentElement;
        const selector = document.querySelector('.selector');
        const content = document.querySelector('.content');
        const tabs = Array.from(selector.querySelectorAll('[data-view]'));

        // Durations live in the stylesheet; read them back rather than
        // restating them here, so the two can't drift apart.
        const ms = prop => {
            const value = getComputedStyle(root).getPropertyValue(prop).trim();
            return value.endsWith('ms') ? parseFloat(value) : parseFloat(value) * 1000;
        };
        const SWAP_OUT_MS = ms('--swap-out-duration');
        // Longest possible entrance: the last element's delay plus its run.
        const ENTRANCE_MS = ms('--reveal-duration') + 10 * ms('--reveal-stagger');

        const cache = new Map();
        let currentView = null;
        // Bumped per request. A response whose token is stale belongs to a view
        // the user has already clicked away from, so it gets dropped.
        let requestToken = 0;

        function loadView(name) {
            if (!cache.has(name)) {
                cache.set(name, fetch(VIEWS[name])
                    .then(response => {
                        if (!response.ok) throw new Error(`${response.status} ${response.statusText}`);
                        return response.text();
                    })
                    .catch(error => {
                        console.error(`Could not load the ${name} view:`, error);
                        cache.delete(name); // so a retry is an actual retry
                        return '<p>Could not load this one — try again?</p>';
                    }));
            }
            return cache.get(name);
        }

        function paint(html) {
            content.innerHTML = html;
            // Number the entries so the stagger in CSS doesn't need to know how
            // many there are.
            content.querySelectorAll('.entry').forEach((entry, i) => {
                entry.style.setProperty('--entry-index', String(i));
            });
        }

        function markSelected(name) {
            tabs.forEach(tab => tab.classList.toggle('selected', tab.dataset.view === name));
        }

        function fadeOut() {
            content.classList.add('is-swapping');
            return new Promise(resolve => setTimeout(resolve, SWAP_OUT_MS));
        }

        async function show(name) {
            if (!VIEWS[name] || name === currentView) return;

            const token = ++requestToken;
            currentView = name;
            markSelected(name);

            // Fetch and fade out concurrently, so the network round trip is
            // spent inside the animation rather than after it.
            const [html] = await Promise.all([loadView(name), fadeOut()]);
            if (token !== requestToken) return;

            paint(html);
            content.classList.remove('is-swapping');
        }

        selector.addEventListener('click', event => {
            const tab = event.target.closest('[data-view]');
            if (tab) show(tab.dataset.view);
        });

        // Resolves once the webfonts have settled. This is the whole reason the
        // entrance waits: `display=swap` paints Georgia first and reflows to
        // Garamond a beat later, and hiding that reflow is most of what makes
        // the load feel clean.
        const fontsSettled = () => document.fonts ? document.fonts.ready : Promise.resolve();

        // Same idea for the portrait — a circle that fills in after the fact is
        // the other visible pop on first load.
        function imageSettled() {
            const img = document.querySelector('.profile-pic img');
            if (!img || img.complete) return Promise.resolve();
            return new Promise(resolve => {
                img.addEventListener('load', resolve, { once: true });
                img.addEventListener('error', resolve, { once: true });
            });
        }

        const withDeadline = (promise, limit) =>
            Promise.race([promise, new Promise(resolve => setTimeout(resolve, limit))]);

        async function start() {
            content.style.setProperty('--entry-base', String(ENTRY_BASE));
            currentView = DEFAULT_VIEW;
            markSelected(DEFAULT_VIEW);

            // The first view is part of the entrance rather than a swap, so it
            // needs to be in the DOM before the reveal — otherwise the right
            // column animates in empty. If it loses the race against the
            // deadline it still animates, just a beat late.
            const firstView = loadView(DEFAULT_VIEW).then(paint);

            try {
                await withDeadline(
                    Promise.all([firstView, fontsSettled(), imageSettled()]),
                    READY_TIMEOUT
                );
            } finally {
                // In a finally, because .js-preload holds the page at opacity 0
                // — anything thrown on the way here would otherwise leave a
                // permanently blank page. Revealing early is recoverable; never
                // revealing is not.
                root.classList.remove('js-preload');
                root.classList.add('is-revealed');
            }

            // Swaps from here on shouldn't inherit the entrance's head start.
            setTimeout(() => content.style.setProperty('--entry-base', '0'), ENTRANCE_MS);
        }

        start();
    </script>
</body>

</html>
