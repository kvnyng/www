    <meta name="description" content="Kevin Yang's resume — a pile of pages dealt by scroll, or the PDF to take with you.">

    <!-- The card a shared link unfurls into. A scraper gets one still and no
         script, so the pile it would have dealt is drawn for it ahead of time
         by scripts/og-card.mjs — the same room, the same two sheets, arranged
         for one frame. Re-run that script when the resume is re-exported.

         Absolute URLs on purpose: a scraper resolves these against nothing. -->
    <meta property="og:type" content="website">
    <meta property="og:site_name" content="Kevin Yang">
    <meta property="og:url" content="https://kvnyng.com/resume/">
    <meta property="og:title" content="Kevin Yang Resume">
    <meta property="og:description" content="Two pages, dealt by scroll — or the PDF to take with you.">
    <meta property="og:image" content="https://kvnyng.com/assets/images/resume-og.png">
    <meta property="og:image:type" content="image/png">
    <meta property="og:image:width" content="1200">
    <meta property="og:image:height" content="630">
    <meta property="og:image:alt" content="The words Kevin Yang Resume set on a dark ground above two resume pages, lying askew and running off the bottom edge.">
    <meta name="twitter:card" content="summary_large_image">
    <meta name="twitter:title" content="Kevin Yang Resume">
    <meta name="twitter:description" content="Two pages, dealt by scroll — or the PDF to take with you.">
    <meta name="twitter:image" content="https://kvnyng.com/assets/images/resume-og.png">

    <!-- Served from this origin, not Google's — mirrored into assets/fonts by
         scripts/fonts-vendor.mjs. The entrance waits on document.fonts.ready,
         and a local fetch is the difference between that wait being felt and
         not. -->
    <link rel="stylesheet" href="/assets/fonts/fonts.css">

    <!-- Both pages at parse time: the top because the entrance waits on it,
         the one beneath because a pile whose under-page is still in flight
         would deal down onto nothing. -->
    <link rel="preload" href="page-1.svg" as="image" type="image/svg+xml">
    <link rel="preload" href="page-2.svg" as="image" type="image/svg+xml">
    <link rel="stylesheet" href="style.css">

    <!-- Inline and synchronous on purpose: this has to land before the first
         paint, or the page flashes at full opacity before the entrance runs.

         And conditional on where the reader came from: the hold-then-rise
         exists to cross with the departure fade of the kvnyng.com page before
         it. Arriving from anywhere else — a search result, a shared link, a
         bare address — there was no fade on the other side, so there is no
         hold on this one: the entrance plays from first paint instead of
         after the fonts. An empty or opaque referrer throws in the URL
         constructor and lands in the no-hold case, which is the right
         reading of not knowing. -->
    <script>
        try {
            if (new URL(document.referrer).origin === location.origin)
                document.documentElement.classList.add('js-preload');
        } catch (e) { }
    </script>

<body>
    <header class="rise" style="--i: 0">
        <nav class="crumbs">
            <a class="home" href="/">kevin yang</a><span class="sep">/</span><span class="here">resume</span>
        </nav>
    </header>

    <div class="scene">
            <div class="pile rise" style="--i: 1">
                <div class="zoomer">
                    <div class="grab">
                        <div class="sheet s2">
                            <div class="aura"></div>
                            <img src="page-2.svg" alt="Resume, page two" width="612" height="792">
                            <div class="textlayer"></div>
                            <div class="dim"></div>
                        </div>
                        <div class="sheet s1">
                            <div class="aura"></div>
                            <img src="page-1.svg" alt="Resume, page one" width="612" height="792">
                            <div class="textlayer"></div>
                        </div>
                    </div>
                </div>
                <div class="tools-arm">
                    <div class="tools">
                        <a class="dl" href="/kevin_yang_resume.pdf" download
                            aria-label="Download the resume as a PDF">
                            <svg viewBox="0 0 24 24" width="22" height="22" fill="none" stroke="currentColor"
                                stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true">
                                <path d="M12 4v11" />
                                <path d="m7 11 5 5 5-5" />
                                <path d="M5 20h14" />
                            </svg>
                        </a>
                    </div>
                </div>
            </div>

            <!-- The rise lives on a perch above the counter, not on the
                 counter itself: the entrance animation fills both ways, so it
                 owns its element's opacity forever after — and the zoom fade
                 needs that channel to itself. -->
            <div class="counter-perch rise" style="--i: 2">
                <p class="counter" aria-hidden="true"><span class="word"><span
                            class="n one selected">one</span><span class="n two">two</span><span
                            class="n live"></span></span>of two</p>
            </div>

        <p class="sr-only" role="status"></p>
    </div>

    <noscript>
        <style>
            /* No script means no deal: give the document its scroll back and
               lay the two pages out as plain reading, one above the other. */
            html, body { overflow: auto; height: auto; }
            .scene { position: static; height: auto; overflow: visible; padding: 6rem 0 3rem; }
            .pile { aspect-ratio: auto; width: min(92vw, 38rem); }
            .grab { position: static; cursor: default; }
            .sheet { position: static; }
            .sheet img { height: auto; margin-bottom: 2rem; }
            .s2 { transform: none; }
            .aura, .dim { display: none; }
        </style>
    </noscript>

    <script>
        (() => {
            const scene = document.querySelector('.scene');
            const pile = document.querySelector('.pile');
            const zoomer = document.querySelector('.zoomer');
            const s1 = document.querySelector('.s1');
            const s2 = document.querySelector('.s2');
            const aura1 = s1.querySelector('.aura');
            const aura2 = s2.querySelector('.aura');
            const dim = s2.querySelector('.dim');
            const grab = document.querySelector('.grab');
            const arm = document.querySelector('.tools-arm');
            const one = document.querySelector('.counter .one');
            const live = document.querySelector('.counter .live');
            const status = document.querySelector('[role="status"]');
            const reduced = matchMedia('(prefers-reduced-motion: reduce)');

            const clamp = (v, lo, hi) => Math.min(hi, Math.max(lo, v));
            const smooth = (u) => u * u * (3 - 2 * u);
            const bez = (a, b, c, d, u) => {
                const v = 1 - u;
                return v * v * v * a + 3 * v * v * u * b + 3 * v * u * u * c + u * u * u * d;
            };

            /* Everything below is a picture of one number: how far page one
               has gone. The hand writes `target` — wheel deltas at a
               sensitivity of this page's choosing, touch drags scaled to the
               screen — and the drawn `current` chases it through one fast
               filter (~60ms), which is what turns a notched wheel's discrete
               ticks into motion that starts the same frame and eases out
               instead of stopping dead. There is no document scroll behind
               any of it, and no snap in front: the pile rests wherever the
               gesture leaves it, mid-deal included. */
            let target = 0;
            let current = 0;
            let raf = null;
            let last = null;

            /* Wheel pixels for a full deal. Small enough that one tick of a
               notched wheel visibly commits the paper to moving. */
            const DEAL_WHEEL = 450;

            /* The commit tween: a short easing that finishes what a gesture
               started. Cancelled the instant a new gesture speaks. */
            let tweenFrom = 0;
            let tweenTo = null;
            let tweenStart = 0;

            /* Overscroll: pushing past either end of the track swings the
               pile out along an arc — bottom-right past the top, bottom-left
               past the bottom — and a spring carries it home on release.
               `overTarget` is where the hand has pushed it (decaying toward
               zero on its own), `overCurrent` is where the paper actually is,
               trailing it. Positive is the top-end swing, negative the
               bottom-end one. */
            let overTarget = 0;
            let overCurrent = 0;

            /* Measured once and on resize, never per event. */
            let W = 0, H = 0;
            function measure() {
                W = innerWidth;
                H = innerHeight;
            }
            measure();

            /* ── The odometer ─────────────────────────────────────────────
               The counter word does not swap, it counts: each letter of
               "one" cycles through the alphabet to its letter in "two", one
               position at a time — o rolls to t, then n to w, then e to o —
               and the whole roll is a pure function of the deal, so dragging
               the paper back rolls the letters back the way they came, last
               position first. The deal's range is shared out proportionally
               to each letter's distance, so the alphabet always turns at one
               speed under the hand. Positions the source word lacks begin at
               "a"; positions the destination lacks roll home to "a" and step
               off. */
            const FROM = 'one';
            const TO = 'two';
            const segs = [];
            let totalSteps = 0;
            for (let i = 0; i < Math.max(FROM.length, TO.length); i++) {
                const src = FROM[i] ? FROM.charCodeAt(i) - 97 : null;
                const dst = TO[i] ? TO.charCodeAt(i) - 97 : null;
                const steps =
                    src !== null && dst !== null ? (dst - src + 26) % 26 :
                    dst !== null ? dst : src;
                segs.push({ src, dst, steps });
                totalSteps += steps;
            }
            function wordAt(t) {
                if (t <= 0) return FROM;
                if (t >= 1) return TO;
                let pos = t * totalSteps;
                let out = '';
                for (const g of segs) {
                    const local = clamp(pos, 0, g.steps);
                    pos -= g.steps;
                    /* Midpoint flips: each letter changes halfway through
                       its window, so the last one lands at t ≈ 0.98 instead
                       of exactly 1 — which the tween's ease-out and the
                       chase only ever approach asymptotically. Flipping on
                       the boundary made the final letter hang. */
                    const idx = Math.min(g.steps, Math.floor(local + 0.5));
                    if (g.src === null) {
                        /* Filled in from "a", present once its turn starts. */
                        if (local > 0) out += String.fromCharCode(97 + idx % 26);
                    } else if (g.dst === null) {
                        /* Rolls home to "a", then steps off the word. */
                        if (local < g.steps) out += String.fromCharCode(97 + g.src - idx);
                    } else {
                        out += String.fromCharCode(97 + (g.src + idx) % 26);
                    }
                }
                return out;
            }
            let shownWord = '';

            /* The cell is sized once to the widest word the roll can ever
               show, so "of two" never moves an inch mid-cycle. */
            function fitCounter() {
                const cs = getComputedStyle(live);
                const ctx = document.createElement('canvas').getContext('2d');
                ctx.font = `${cs.fontStyle} ${cs.fontWeight} ${cs.fontSize} ${cs.fontFamily}`;
                let max = 0;
                for (let k = 0; k <= totalSteps; k++) {
                    max = Math.max(max, ctx.measureText(wordAt(k / totalSteps)).width);
                }
                document.querySelector('.counter .word').style.minWidth = Math.ceil(max) + 'px';
            }

            function paint(t) {
                const st = smooth(t);
                /* The swing: linear travel sideways, squared travel down —
                   a parabolic arc — with a little lean into the turn. It
                   moves the whole handful (sheets, shades, dim) plus the tool
                   arm, which composes it ahead of its own under-page tilt. */
                const o = overCurrent;
                const swing = o === 0 ? '' :
                    `translate3d(${0.14 * pile.offsetWidth * o}px, ${0.07 * pile.offsetHeight * o * o}px, 0)` +
                    ` rotateZ(${5 * o}deg)`;
                if (reduced.matches) {
                    /* No flight: the top page simply thins away in place. */
                    s1.style.transform = 'none';
                    s1.style.opacity = String(1 - st);
                    s2.style.transform = 'none';
                    arm.style.transform = 'none';
                    grab.style.transform = '';
                } else {
                    grab.style.transform = swing;
                    /* The flight is a cubic bezier in viewport units: a small
                       lift up-and-left first — the pick — then the long sweep
                       down and off the bottom-left, twisting as it goes.

                       Translate and rotate only, no scale: the sheets are
                       layers of rastered vector paths, and a scale that moves
                       every frame makes the compositor re-raster them at each
                       new size. Rotation and travel reuse the same texture;
                       the lift is sold by the shade instead. */
                    const x = bez(0, -0.16 * W, -0.80 * W, -1.35 * W, t);
                    const y = bez(0, -0.08 * H, 0.28 * H, 1.10 * H, t);
                    /* Airborne-ness: rises from the desk, gone again before
                       the sheet leaves frame, so nothing pops at the end. */
                    const air = Math.sin(Math.PI * Math.min(1, t * 1.25));
                    s1.style.opacity = '';
                    s1.style.transform =
                        `translate3d(${x}px, ${y}px, 0) rotateZ(${-34 * st}deg)` +
                        ` rotateX(${6 * air}deg)`;
                    /* The shade under the flying sheet slides out from beneath
                       it and thins — height read as light. */
                    aura1.style.opacity = String(0.38 + 0.22 * air);
                    aura1.style.transform =
                        `translate(${-18 * air}px, ${24 * air}px) scale(${1 + 0.1 * air})`;
                    /* And the page beneath is promoted: its resting askew
                       unwinds, its dimness lifts, its shade deepens into the
                       contact shadow of a top page. */
                    /* The arm shares the under-page's transform verbatim, so
                       the tools hang off that sheet's shoulder and swing
                       upright with it as it straightens. */
                    const under =
                        `rotateZ(${1.7 * (1 - st)}deg) translate(${0.5 * (1 - st)}%, ${0.6 * (1 - st)}%)`;
                    s2.style.transform = under;
                    arm.style.transform = swing ? `${swing} ${under}` : under;
                    aura2.style.opacity = String(0.30 + 0.12 * st);
                }
                dim.style.opacity = String(0.07 * (1 - st));
                const w = reduced.matches ? (t < 0.5 ? FROM : TO) : wordAt(t);
                if (w !== shownWord) {
                    shownWord = w;
                    live.textContent = w;
                }
            }

            function step(ts) {
                const dt = last === null ? 16.7 : ts - last;
                last = ts;
                /* Time-based decay so the trail feels the same at 60 and 120Hz. */
                const k = reduced.matches ? 1 : 1 - Math.pow(0.725, dt / 16.7);
                /* The navigation tween eases an asked-for page in — only
                   ever started by an explicit request, never by the clock. */
                if (tweenTo !== null) {
                    const u = Math.min(1, (ts - tweenStart) / (reduced.matches ? 1 : 320));
                    target = tweenFrom + (tweenTo - tweenFrom) * (1 - Math.pow(1 - u, 3));
                    if (u === 1) {
                        target = tweenTo;
                        tweenTo = null;
                        rest();
                    }
                }
                /* The chase: fast enough to be felt as direct, slow enough
                   to round a tick's edges. */
                const kc = reduced.matches ? 1 : 1 - Math.exp(-dt / 60);
                const dd = target - current;
                current = Math.abs(dd) < 0.001 ? target : current + dd * kc;
                /* The overscroll spring: the pushed-to point sags toward zero
                   on its own clock, and the paper trails it — out fast under
                   the hand, home on an easing arc when the hand lets go. */
                overTarget -= overTarget * (1 - Math.pow(0.774, dt / 16.7));
                if (Math.abs(overTarget) < 0.002) overTarget = 0;
                const od = overTarget - overCurrent;
                overCurrent = (overTarget === 0 && Math.abs(od) < 0.002) ? 0 : overCurrent + od * k;
                paint(current);
                if (tweenTo === null && current === target &&
                    overCurrent === 0 && overTarget === 0) {
                    raf = null;
                    last = null;
                } else {
                    raf = requestAnimationFrame(step);
                }
            }
            const kick = () => { if (raf === null) raf = requestAnimationFrame(step); };

            addEventListener('resize', () => { measure(); kick(); buildTextLayers(); });

            /* The pile is at rest on a page: tell the world which. */
            function announce() {
                const onTwo = target >= 0.5;
                history.replaceState(null, '', onTwo ? '#two' : location.pathname);
                status.textContent = onTwo ? 'Showing page two of two' : 'Showing page one of two';
            }

            /* A gesture has come to a stop. That is the bookkeeping above,
               and it is also a hand arriving — which is why the PDF gets
               asked for here. The forgiveness in ensurePdf's catch is only
               permission to try again; something has to actually reach a
               second time, and a deal settling and the glass coming up are
               where reaching happens. Both calls cost nothing once the
               document is in hand. */
            function rest() {
                announce();
                ensurePdf();
            }

            /* No snapping: the pile rests wherever the hand leaves it. The
               idle timer only brings the bookkeeping — hash, label — up to
               date once the motion has gone quiet. */
            let idleTimer = null;
            function armIdle() {
                clearTimeout(idleTimer);
                idleTimer = setTimeout(() => {
                    if (tweenTo === null) rest();
                }, 160);
            }

            function goTo(p) {
                if (p === target) { rest(); return; }
                tweenFrom = target;
                tweenTo = p;
                tweenStart = performance.now();
                kick();
            }

            /* macOS goes on sending wheel events after the fingers lift —
               the same momentum that carries a deal through. At the end of
               the track that tail is indistinguishable from a hand still
               pushing, and it holds the swing out against the swing's own
               decay: push and decay come into balance, the paper hangs at
               the far end, and only once the tail dies does it start home.
               That hang is the pause at the turn.

               Momentum falls away monotonically where a hand is ragged, so
               three deltas in a row that only shrink are read as the hand
               having gone. A delta above the run's peak, or a gap, is a new
               push, and the swing listens again. */
            const FADE_RUN = 3;         // shrinking deltas in a row that mean the hand has lifted
            let prevPush = 0, peakPush = 0, fading = 0, lastPush = 0, released = false;

            function handOn(dy) {
                const now = performance.now();
                const mag = Math.abs(dy);
                if (now - lastPush > 120) { peakPush = prevPush = fading = 0; released = false; }
                lastPush = now;
                if (mag > peakPush) { peakPush = mag; fading = 0; released = false; }
                else if (mag <= prevPush * 0.995) { if (++fading >= FADE_RUN) released = true; }
                else fading = 0;
                prevPush = mag;
                return !released;
            }

            /* One entry point for every dealing gesture, in wheel pixels.
               At the ends the push spills into the overscroll swing — every
               pixel of it, from the first: the paper answers the hand at
               whatever speed the hand arrives, and how far it swings is the
               only thing the push decides. */
            function scrub(dy, settleOnIdle) {
                if (target <= 0 && dy < 0) {
                    if (!reduced.matches && handOn(dy)) overTarget = clamp(overTarget - dy * 0.0046, 0, 1);
                } else if (target >= 1 && dy > 0) {
                    if (!reduced.matches && handOn(dy)) overTarget = clamp(overTarget - dy * 0.0046, -1, 0);
                } else {
                    peakPush = prevPush = fading = 0;
                    released = false;
                    tweenTo = null;
                    target = clamp(target + dy / DEAL_WHEEL, 0, 1);
                }
                kick();
                if (settleOnIdle) armIdle();
            }
            /* Escape puts the glass down; the arrows and page keys deal. And
               under the glass they do not deal at all — the same diversion
               the wheel and a finger already make, for a better reason than
               tidiness: the flight is a per-frame rotation of paper drawn at
               1x, and the moment the glass is up the layer pins are off, so a
               deal at 256x would be asking the compositor to re-raster two
               enormous sheets on every frame of it. Escape first, then the
               deal — which is also what makes "mid-deal the pins are right"
               true, since mid-deal can no longer happen zoomed. */
            addEventListener('keydown', (e) => {
                if (e.metaKey || e.ctrlKey || e.altKey) return;
                if (e.key === 'Escape') { z = 1; panX = panY = 0; applyZoom(); return; }
                if (z > 1) return;
                if (e.key === 'ArrowRight' || e.key === 'PageDown') goTo(1);
                if (e.key === 'ArrowLeft' || e.key === 'PageUp') goTo(0);
            });

            /* ── The magnifying glass ─────────────────────────────────────
               Pinch (which browsers report as a ctrl-wheel), or a literal
               ctrl-scroll, zooms about the cursor; shift-drag or right-drag
               pans. All of it is one transform on the zoomer, so the flight
               and the deal are untouched underneath it. */
            let z = 1, panX = 0, panY = 0;
            let panning = false, panned = false, lx = 0, ly = 0;
            let zoomIdle = null;

            const writeZoom = () => {
                zoomer.style.transform = z === 1 ? '' :
                    `translate3d(${panX}px, ${panY}px, 0) scale(${z})`;
            };

            function applyZoom() {
                /* The pan is leashed to the zoom: enough travel to reach any
                   corner of the enlarged sheet, never enough to lose it. */
                const mx = (z - 1) * pile.offsetWidth * 0.75;
                const my = (z - 1) * pile.offsetHeight * 0.75;
                panX = clamp(panX, -mx, mx);
                panY = clamp(panY, -my, my);
                writeZoom();
                /* The caption is furniture of the pile, not the paper: under
                   the glass it steps out of the way, and it walks back in
                   when the glass is put down. But this class carries more
                   than furniture now — it is also what releases the layer
                   pins, and so what lets the sheets be drawn again from their
                   vectors. See the lens note below. */
                scene.classList.toggle('zoomed', z !== 1);
                ensurePdf();
                /* Every write restarts the wait for the hand to stop; putting
                   the glass down cancels it outright. */
                clearTimeout(zoomIdle);
                if (z !== 1) zoomIdle = setTimeout(settleZoom, 150);
            }

            /* ── The half pixel ───────────────────────────────────────────
               The transform rasters at native scale: hold the view still and
               the crop is the same bytes the browser's own page zoom makes of
               the same sheet, to the byte. What is left is where the layer
               lands. Off the device grid, the compositor no longer has curves
               to draw — it has a finished bitmap it must set down between
               pixels, two taps wide, so every edge in the type takes on half a
               pixel of its neighbour's ink. That is the whole of the residual
               softness, and it is a matter of phase, not scale: an edge
               measures 1.47px across at a whole-pixel offset and 2.20px at
               half of one.

               So when the hand goes quiet the sheet's own corner is rounded
               onto the grid. At most half a device pixel, once, a sixth of a
               second after the last write — too small and too late to read as
               motion, and the picture comes up sharp. It hangs off applyZoom,
               the one door every zoom and pan passes through, so Safari's
               gesture events are settled by the same string without being
               wired to it. And it writes the transform itself instead of
               going back through applyZoom, so a settle can never arm a
               settle: the nudge is idempotent, but the loop is what would
               have cost, and it is simply not built. The leash is left alone
               — half a device pixel cannot walk the sheet off its tether. */
            function settleZoom() {
                if (z === 1) return;
                const r = pile.getBoundingClientRect();
                const dpr = devicePixelRatio || 1;
                /* Where the sheet's top-left corner is on screen: the pile is
                   untransformed — the zoom lives on its child — so the corner
                   has to be carried out through the scale by hand. */
                const sx = r.left + r.width / 2 + panX - (r.width / 2) * z;
                const sy = r.top + r.height / 2 + panY - (r.height / 2) * z;
                panX += Math.round(sx * dpr) / dpr - sx;
                panY += Math.round(sy * dpr) / dpr - sy;
                writeZoom();
            }

            function zoomAt(cx, cy, nz) {
                /* The ceiling is generosity, not a limit of the renderer —
                   the compositor draws the tracings from their curves at
                   whatever scale it is handed, and the type does not begin to
                   soften until around sixteen thousand times — some sixty
                   times further in than this stops. At 256x a single letter
                   of body type overruns the window: that is no longer
                   reading, it is looking at the shape the ink dried in.
                   There is a ceiling at all only because the arithmetic asks
                   for one — float32 eventually stops being able to say where
                   a corner of the page is. */
                nz = clamp(nz, 1, 256);
                /* Keep the point under the cursor under the cursor. */
                const r = pile.getBoundingClientRect();
                const sx = cx - (r.left + r.width / 2);
                const sy = cy - (r.top + r.height / 2);
                panX = sx - ((sx - panX) / z) * nz;
                panY = sy - ((sy - panY) / z) * nz;
                z = nz;
                applyZoom();
            }

            addEventListener('wheel', (e) => {
                if (e.ctrlKey || e.metaKey) {
                    e.preventDefault();
                    /* Exponential, clamped per event: a pinch's fine deltas
                       glide and a wheel's coarse notches step, both at a sane
                       rate. The clamp is the ceiling on how hard any one
                       event may push — at 8 wheel pixels a shoved pinch
                       climbs about an eighth of a doubling per event, which
                       is a hand closing on the page rather than a jump. */
                    zoomAt(e.clientX, e.clientY,
                        z * Math.exp(clamp(-e.deltaY, -8, 8) * 0.011));
                    return;
                }
                /* Zoomed in, plain scroll moves around the sheet instead of
                   dealing it away — the deal comes back when the glass does. */
                if (z > 1) {
                    e.preventDefault();
                    panX -= e.deltaX;
                    panY -= e.deltaY;
                    applyZoom();
                    return;
                }
                /* The deal itself. Nothing else scrolls on this page, so the
                   wheel's deltas are the hand on the pile — momentum
                   included, since macOS delivers it as more wheel events. */
                e.preventDefault();
                scrub(e.deltaY, true);
            }, { passive: false });

            /* Safari reports a pinch as its own gesture, not a ctrl-wheel. */
            let gestureBase = 1;
            addEventListener('gesturestart', (e) => { e.preventDefault(); gestureBase = z; });
            addEventListener('gesturechange', (e) => {
                e.preventDefault();
                zoomAt(e.clientX, e.clientY, gestureBase * e.scale);
            });
            addEventListener('gestureend', (e) => e.preventDefault());

            let touchDrag = null;
            scene.addEventListener('pointerdown', (e) => {
                if (e.button === 2 || (e.button === 0 && e.shiftKey) ||
                    (e.pointerType === 'touch' && z > 1)) {
                    panning = true;
                    panned = false;
                    lx = e.clientX;
                    ly = e.clientY;
                    try { scene.setPointerCapture(e.pointerId); } catch (err) { }
                    scene.classList.add('panning');
                    e.preventDefault();
                } else if (e.pointerType === 'touch') {
                    /* A finger on the unzoomed pile is a hand on the deal. */
                    touchDrag = { y: e.clientY, moved: 0 };
                    try { scene.setPointerCapture(e.pointerId); } catch (err) { }
                }
            });
            scene.addEventListener('pointermove', (e) => {
                if (panning) {
                    panX += e.clientX - lx;
                    panY += e.clientY - ly;
                    lx = e.clientX;
                    ly = e.clientY;
                    panned = true;
                    applyZoom();
                } else if (touchDrag) {
                    const dy = touchDrag.y - e.clientY;
                    touchDrag.y = e.clientY;
                    touchDrag.moved += Math.abs(dy);
                    /* Scaled so a bit over half the screen's height deals a
                       page; committed on release, not mid-hold. */
                    scrub(dy * (DEAL_WHEEL / (0.55 * H)), false);
                }
            });
            const endPan = () => {
                if (touchDrag) {
                    if (touchDrag.moved > 8) panned = true;
                    touchDrag = null;
                    armIdle();
                }
                panning = false;
                scene.classList.remove('panning');
            };
            scene.addEventListener('pointerup', endPan);
            scene.addEventListener('pointercancel', endPan);
            /* The right button pans, so the menu it usually carries is off
               within the scene. */
            scene.addEventListener('contextmenu', (e) => e.preventDefault());

            /* ── The lens ─────────────────────────────────────────────────
               There is no lens in this file, and that is the whole finding.
               The sheets are not photographs of paper: they are pdftocairo's
               tracings, every glyph a path, so the browser has held the
               vectors all along and will happily draw them again at whatever
               scale the zoomer's transform asks for.

               What stood between the compositor and those curves was this
               page's own doing. will-change: transform sat on the zoomer, on
               the grab and on each sheet — three hints, each of which
               promotes a layer and freezes its raster at the size it was
               first drawn. A frozen layer is never redrawn, only stretched,
               and the smear that came of it grew exactly in step with the
               zoom. That smear is what a whole tiled PDF renderer was once
               built here to answer, at some hundreds of lines, when the fix
               was to stop asking for it: under the glass the three hints are
               released and the picture comes back sharp a frame or two after
               the gesture settles. The release lives in the stylesheet, on
               .scene.zoomed — one declaration, and it is the entire lens.

               The pins go back on the moment the glass is put down, because
               at rest and mid-deal they are right: the flight is translation
               and rotation of paper drawn at 1x, which is precisely the case
               a promoted layer exists for.

               pdf.js still comes down, but no longer for pixels. It is here
               for the ink you can touch — the text layer and the document's
               own links, immediately below. */
            let pdfLib = null;
            let pdfPages = [null, null];
            let pdfWanted = false;

            async function ensurePdf() {
                if (pdfWanted) return;
                pdfWanted = true;
                try {
                    const lib = await import('./vendor/pdf.min.js');
                    lib.GlobalWorkerOptions.workerSrc = './vendor/pdf.worker.min.js';
                    /* The overlay must wear the page's own face. pdf.js lays
                       each run in a generic family and squeezes it (--scale-x)
                       until its ends meet the printed run's — which pins the
                       edges but lets every position inside a span follow the
                       wrong font's advances, so a highlight or a selection
                       mid-line drifts off the ink. The resume is EB Garamond
                       and the site already serves it; this map is consulted
                       for both the spans' style and the measurement behind
                       --scale-x, so glyphs and calibration move together. */
                    lib.TextLayer.fontFamilyMap.set('serif', "'EB Garamond', serif");
                    lib.TextLayer.fontFamilyMap.set('sans-serif', "'EB Garamond', sans-serif");
                    const doc = await lib.getDocument('/kevin_yang_resume.pdf').promise;
                    pdfLib = lib;
                    pdfPages = [await doc.getPage(1), await doc.getPage(2)];
                    buildTextLayers();
                } catch (err) {
                    /* No words to select and no links to click, but the pages
                       themselves are pictures and still stand — and a flaky
                       fetch is forgiven after a beat rather than for good. */
                    setTimeout(() => { pdfWanted = false; }, 4000);
                }
            }

            /* ── The ink you can touch ────────────────────────────────────
               The visible pages are pictures, but a PDF knows its own words.
               A transparent text layer from the real document lies over each
               sheet — same glyphs, same places, no color — so the paper can
               be selected, copied, and its links clicked. It lives in sheet
               coordinates and rides every transform the sheet takes. */
            const textLayers = [
                document.querySelector('.s1 .textlayer'),
                document.querySelector('.s2 .textlayer'),
            ];
            let textBuiltAt = 0;
            async function buildTextLayers() {
                if (!pdfLib || !pdfPages[0]) return;
                /* Measure only once the face is truly in: --scale-x comes
                   from a canvas measurement, and one taken against the
                   fallback while Garamond swaps in later would calibrate
                   the squeeze to a font no longer on the glass. */
                await document.fonts.load('1em "EB Garamond"');
                const wpx = pile.offsetWidth;
                if (!wpx || wpx === textBuiltAt) return;
                textBuiltAt = wpx;
                for (let i = 0; i < 2; i++) {
                    const container = textLayers[i];
                    container.replaceChildren();
                    catchers.delete(container);
                    const viewport = pdfPages[i].getViewport({ scale: wpx / 612 });
                    container.style.setProperty('--scale-factor', viewport.scale);
                    await new pdfLib.TextLayer({
                        textContentSource: pdfPages[i].streamTextContent(),
                        container,
                        viewport,
                    }).render();
                    /* The furniture is printed, not written: a dot that
                       separates the header's entries, a bullet that opens a
                       line, and the breaths of air either side. The dots and
                       bullets go .deco — unselectable, uncopyable; a dot is
                       a span of its own, a bullet shares its line's span and
                       is split off into a nested one. The air is different:
                       pdf.js gives each gap's space its own span, and those
                       stay selectable so a copy keeps the entries apart, but
                       go .spacer — selected air takes no wash. */
                    for (const span of container.querySelectorAll(':scope > span')) {
                        const text = span.textContent;
                        if (span.firstChild.nodeType !== Node.TEXT_NODE) continue;
                        if (/^\s+$/.test(text)) {
                            span.classList.add('spacer');
                            continue;
                        }
                        if (/^[\s·]+$/.test(text)) {
                            span.classList.add('deco');
                            continue;
                        }
                        const lead = text.match(/^[•·]+\s*/);
                        if (lead) {
                            /* A bullet opening its line: split off, spaces
                               and all, so a copied line starts at its words. */
                            const rest = span.firstChild.splitText(lead[0].length);
                            const deco = document.createElement('span');
                            deco.className = 'deco';
                            deco.appendChild(span.firstChild);
                            span.insertBefore(deco, rest);
                        }
                    }
                    /* The document's own hyperlinks, as real anchors. */
                    for (const a of await pdfPages[i].getAnnotations()) {
                        if (a.subtype !== 'Link' || !a.url) continue;
                        const [x1, y1, x2, y2] = viewport.convertToViewportRectangle(a.rect);
                        const link = document.createElement('a');
                        link.href = a.url;
                        link.target = '_blank';
                        link.rel = 'noopener';
                        link.style.left = Math.min(x1, x2) + 'px';
                        link.style.top = Math.min(y1, y2) + 'px';
                        link.style.width = Math.abs(x2 - x1) + 'px';
                        link.style.height = Math.abs(y2 - y1) + 'px';
                        container.appendChild(link);
                    }
                    /* The selection's safety net, last in the layer — see
                       the catcher block below and .endofcontent in the
                       stylesheet. */
                    const end = document.createElement('div');
                    end.className = 'endofcontent';
                    container.appendChild(end);
                    catchers.set(container, end);
                }
            }

            /* ── The catcher ──────────────────────────────────────────────
               Drag a selection off the words and onto the empty paper, and
               Chromium resolves the cursor to the nearest text position in
               the layer — which, from below a paragraph, is the far end of
               everything before it: one slip and the whole page lights up.
               This is pdf.js's own viewer remedy, carried over. While a
               selection is being made, its layer wears .selecting and the
               catcher div opens to cover the sheet beneath the words, so
               the empty paper is itself a selectable nothing for the cursor
               to land on. And because Chromium would still leap across all
               the text between the selection and wherever the catcher sits
               in the DOM, the catcher is re-seated beside the selection's
               moving edge on every change — a leap can never outgrow the
               span under the hand. Firefox needs only the cover. */
            const catchers = new Map();
            const resetCatchers = () => {
                for (const [layer, end] of catchers) {
                    layer.append(end);
                    end.style.width = end.style.height = '';
                    end.style.userSelect = '';
                    layer.classList.remove('selecting');
                }
            };
            let pointerIsDown = false;
            let prevRange = null;
            const isFirefox = CSS.supports('-moz-user-select', 'none');
            for (const layer of textLayers) {
                layer.addEventListener('mousedown', () => layer.classList.add('selecting'));
            }
            addEventListener('pointerdown', () => { pointerIsDown = true; });
            addEventListener('pointerup', () => { pointerIsDown = false; resetCatchers(); });
            addEventListener('blur', () => { pointerIsDown = false; resetCatchers(); });
            addEventListener('keyup', () => { if (!pointerIsDown) resetCatchers(); });
            document.addEventListener('selectionchange', () => {
                const sel = document.getSelection();
                if (!sel.rangeCount) { resetCatchers(); return; }
                for (const [layer] of catchers) {
                    let touched = false;
                    for (let i = 0; i < sel.rangeCount; i++) {
                        if (sel.getRangeAt(i).intersectsNode(layer)) { touched = true; break; }
                    }
                    if (touched) layer.classList.add('selecting');
                    else {
                        layer.append(catchers.get(layer));
                        layer.classList.remove('selecting');
                    }
                }
                if (isFirefox) return;
                /* Which edge of the selection is moving, and the span it
                   is moving through — the walk mirrors pdf.js verbatim. */
                const range = sel.getRangeAt(0);
                const modifyStart = prevRange &&
                    (range.compareBoundaryPoints(Range.END_TO_END, prevRange) === 0 ||
                        range.compareBoundaryPoints(Range.START_TO_END, prevRange) === 0);
                let anchor = modifyStart ? range.startContainer : range.endContainer;
                if (anchor.nodeType === Node.TEXT_NODE) anchor = anchor.parentNode;
                if (anchor.classList?.contains('deco')) anchor = anchor.parentNode;
                if (!modifyStart && range.endOffset === 0) {
                    do {
                        while (!anchor.previousSibling) anchor = anchor.parentNode;
                        anchor = anchor.previousSibling;
                    } while (!anchor.childNodes.length);
                }
                const layer = anchor.parentElement?.closest('.textlayer');
                const end = catchers.get(layer);
                if (end) {
                    end.style.width = layer.style.width;
                    end.style.height = layer.style.height;
                    end.style.userSelect = 'text';
                    anchor.parentElement.insertBefore(end,
                        modifyStart ? anchor : anchor.nextSibling);
                }
                prevRange = range.cloneRange();
            });

            /* #two deep-links to the second page: arrive with page one
               already dealt away, without replaying the flight. */
            one.classList.remove('selected');
            if (location.hash === '#two') target = current = 1;
            paint(current);
            /* The bookkeeping only, not rest(): nobody has reached for
               anything yet, and the PDF is a megabyte and a half that the
               entrance should not be racing. It comes in on the timer below,
               once the paper is up. */
            announce();

            /* The entrance holds until the type has settled and the pile
               itself has decoded — the paper is the page here, so painting
               before it exists would be an entrance onto an empty desk. The
               timeout is insurance against a stylesheet that never answers.

               But only when there is a hold to lift: the head only sets
               .js-preload when the reader stepped over from another page of
               this site, whose departure fade this entrance completes. A
               reader from elsewhere gets the rise from first paint, waiting
               on nothing. */
            const arrive = () => document.documentElement.classList.add('ready');
            /* The words and links want to be touchable without a zoom having
               happened first, so the PDF comes in soon after the entrance. */
            setTimeout(ensurePdf, 600);
            document.fonts.ready.then(fitCounter);
            if (document.documentElement.classList.contains('js-preload')) {
                Promise.all([
                    document.fonts.ready,
                    s1.querySelector('img').decode().catch(() => { }),
                ]).then(arrive);
                setTimeout(arrive, 1500);
            } else {
                arrive();
            }
            /* Warm the under-page too, so the first deal never lands on a
               page still being decoded. */
            s2.querySelector('img').decode().catch(() => { });
            /* And warm the words ahead of need: once the page has loaded and
               the browser has a free moment, fetch pdf.js and parse the PDF,
               so a hand reaching to select a line meets a text layer already
               standing instead of a download just beginning. */
            addEventListener('load', () => {
                (self.requestIdleCallback || ((fn) => setTimeout(fn, 1000)))(() => ensurePdf());
            }, { once: true });
        })();
    </script>
    <!-- ── Departure ────────────────────────────────────────────────────────
         The counterpart to the entrance. Every page of this site holds at
         nothing and rises into place; without this, following a link cuts the
         one you are on off where it stands, and the next begins its rise over
         a screen that has already gone. So a click on an internal link fades
         this document out first and only hands the URL over at the end of the
         fade: the two cross on the grey they share rather than one replacing
         the other mid-sentence.

         Only the leaving is new. The arriving half is the entrance that was
         already here.

         The same twenty lines sit at the foot of the front page's index.html,
         which is where the note explaining why they are copied rather than
         shared lives too. -->
    <script>
        (() => {
            const root = document.documentElement;

            // The length lives in the stylesheet, beside the rule it drives, so
            // the wait and the fade can't drift apart — and so the
            // reduced-motion override shortens the two of them together.
            const declared = getComputedStyle(root).getPropertyValue('--leave-duration').trim();
            const LEAVE_MS = declared.endsWith('ms') ? parseFloat(declared) : parseFloat(declared) * 1000;

            // Where following the link under this element would take the
            // reader, if following it means replacing this document — and null
            // if it doesn't. A new tab, a download, a link off the site, a
            // fragment on this same page: all real navigations, none of them a
            // departure, and swallowing one would break the link rather than
            // dress it. An SVG <a> falls out here too, on the instanceof: its
            // href isn't a string, and nothing on the site uses one.
            function destinationOf(target) {
                const link = target.closest && target.closest('a[href]');
                if (!(link instanceof HTMLAnchorElement)) return null;
                if (link.target && link.target !== '_self') return null;
                if (link.hasAttribute('download')) return null;
                const url = new URL(link.href);
                if (url.origin !== location.origin) return null;
                if (url.pathname === location.pathname && url.search === location.search) return null;
                return url.href;
            }

            // A middle click, a modified click, a click something else has
            // already claimed: the browser has its own plans for those.
            const isPlainClick = event =>
                !event.defaultPrevented && event.button === 0
                && !event.metaKey && !event.ctrlKey && !event.shiftKey && !event.altKey;

            // Warm the destination on the way to the click. The fade is a fixed
            // length; the request behind it is not, and an unwarmed one leaves
            // the reader looking at an empty room for however long the network
            // takes. Asked for on hover — and on the first touch, which arrives
            // as one — the document is usually already in hand by the time the
            // fade is over. The same move the view swap makes by fetching and
            // fading at once. A browser that ignores the hint just asks at
            // navigation time, which is where it began.
            const warmed = new Set();
            addEventListener('pointerover', event => {
                const href = destinationOf(event.target);
                if (!href || warmed.has(href)) return;
                warmed.add(href);
                const hint = document.createElement('link');
                hint.rel = 'prefetch';
                hint.href = href;
                document.head.appendChild(hint);
            });

            addEventListener('click', event => {
                if (!isPlainClick(event)) return;
                const href = destinationOf(event.target);
                if (!href) return;
                event.preventDefault();
                root.classList.add('is-leaving');
                setTimeout(() => { location.href = href; }, LEAVE_MS);
            });

            // Step back into a page the browser kept whole and it is handed
            // back exactly as it was left — faded to nothing, halfway out the
            // door. Nothing else clears the class, because on an ordinary load
            // nothing carries it in.
            addEventListener('pageshow', event => {
                if (event.persisted) root.classList.remove('is-leaving');
            });
        })();
    </script>
</body>
